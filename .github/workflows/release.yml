name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, for example v0.1.0
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag=""
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n1 | grep -oE '^v[0-9][0-9A-Za-z._-]*' || true)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # nix bundle includes the full closure, so the asset runs on a plain
      # system without a binary cache or a local nix store.
      - name: Build bundled binary
        run: |
          mkdir -p dist
          nix bundle .#packages.x86_64-linux.default -o dist/nix-shell-gui
          cp -L dist/nix-shell-gui dist/nix-shell-gui.bin
          rm dist/nix-shell-gui

      - name: Generate checksums
        run: |
          cd dist
          sha256sum nix-shell-gui.bin > SHA256SUMS

      # The release also publishes a small flake. Add it as an input and use
      # packages.<system>.nix-shell-gui to fetch and install the bundle without
      # building it. The fetchurl hash pins the asset.
      - name: Generate release flake
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          sha=$(sha256sum dist/nix-shell-gui.bin | cut -d' ' -f1)
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          mkdir -p dist/flake
          cp "$GITHUB_WORKSPACE/nix-shell-gui.desktop" dist/flake/
          cat > dist/flake/flake.nix <<EOF
          {
            inputs.nixpkgs.url = "github:NixOS/nixpkgs/nixos-unstable";

            outputs = { self, nixpkgs }:
              let
                systems = [ "x86_64-linux" ];
                forAllSystems = f: nixpkgs.lib.genAttrs systems (system: f nixpkgs.legacyPackages.\${system});
                mk = pkgs: pkgs.stdenvNoCC.mkDerivation {
                  pname = "nix-shell-gui";
                  version = "${TAG}";
                  src = pkgs.fetchurl {
                    url = "${base}/nix-shell-gui.bin";
                    sha256 = "${sha}";
                  };
                  dontUnpack = true;
                  dontFixup = true;
                  installPhase = ''
                    install -Dm755 \$src \$out/bin/nix-shell-gui
                    install -Dm644 \${./nix-shell-gui.desktop} \$out/share/applications/nix-shell-gui.desktop
                  '';
                };
              in {
                packages = forAllSystems (pkgs: {
                  nix-shell-gui = mk pkgs;
                  default = mk pkgs;
                });
              };
          }
          EOF
          tar -czf dist/nix-shell-gui-flake.tar.gz -C dist/flake .

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/nix-shell-gui.bin
            dist/nix-shell-gui-flake.tar.gz
            dist/SHA256SUMS
